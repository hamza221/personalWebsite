name: Auto-merge empty PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [Build, Lint]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-empty-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge-empty:
    runs-on: ubuntu-latest
    steps:
      # Both events have a write token. Never check out PR code or download its artifacts.
      - name: Merge only a verified empty PR
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run && (run.event !== 'pull_request' || run.conclusion !== 'success')) {
              core.info('Skipping unsuccessful or non-PR CI run.');
              return;
            }

            let candidates;
            if (run) {
              // Fork workflow_run payloads can have an empty pull_requests array.
              // Resolve open PRs from GitHub instead of trusting that association.
              candidates = await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
                per_page: 100,
              });
              candidates = candidates.filter(pr =>
                pr.head.sha === run.head_sha &&
                pr.head.repo?.id === run.head_repository.id
              );
            } else {
              candidates = [context.payload.pull_request];
            }

            for (const candidate of candidates) {
              const params = { ...context.repo, pull_number: candidate.number };
              const { data: pr } = await github.rest.pulls.get(params);
              if (pr.state !== 'open' || pr.draft || pr.merged) {
                core.info('Skipping closed, merged, or draft PR.');
                continue;
              }
              if (run && pr.head.sha !== run.head_sha) {
                core.info('Skipping CI result for an outdated head.');
                continue;
              }
              if (pr.changed_files !== 0) {
                core.info('Skipping PR with file changes.');
                continue;
              }

              // A single returned file is enough to disqualify the PR.
              const { data: files } = await github.rest.pulls.listFiles({ ...params, per_page: 1 });
              if (files.length !== 0) {
                core.info('Skipping PR with file changes.');
                continue;
              }

              // Recheck after reading the diff; never merge a different revision.
              const { data: current } = await github.rest.pulls.get(params);
              if (
                current.state !== 'open' || current.draft || current.merged ||
                current.changed_files !== 0 || current.head.sha !== pr.head.sha ||
                current.base.sha !== pr.base.sha || current.base.ref !== pr.base.ref
              ) {
                core.info('Skipping PR that changed during validation.');
                continue;
              }

              // Do not queue approval that could outlive this verified revision.
              // A successful Build/Lint completion will trigger another fresh check.
              try {
                const { data: result } = await github.rest.pulls.merge({
                  ...params,
                  sha: pr.head.sha,
                  merge_method: 'merge',
                });
                if (!result.merged) {
                  core.setFailed(`GitHub did not merge the empty PR: ${result.message}`);
                  continue;
                }
                core.info(`Merged empty PR #${params.pull_number}: ${result.sha}`);
              } catch (error) {
                const message = error.response?.data?.message || error.message;
                if (
                  error.status === 405 &&
                  /required status checks?/i.test(message) &&
                  /in progress|expected|pending/i.test(message)
                ) {
                  core.info('Waiting for required checks; CI completion will revalidate this PR.');
                  continue;
                }
                throw error;
              }
            }
